<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#0f0f23">
        <title>Puzzle Hub</title>

        <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
        <link rel="shortcut icon" href="/static/favicon/favicon.ico">

        <!-- the full dockview build injects its own stylesheet at runtime (the esm build ships without css) -->
        <script src="https://cdn.jsdelivr.net/npm/dockview-core@8.8.3/dist/dockview-core.min.js"
            integrity="sha384-9yO/iRbQ/2jadvRhHd0ZvZkYnmtwRHce1Xto9WOUKemkNcKX6WhKsXo+17FNiVOM" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="/static/styles.css">

        <!-- apply the theme that was last on screen before the first paint so there is no flash of the default colours -->
        <script>
        try {
            const stored = JSON.parse(localStorage.getItem('hub.settings') || '{}');
            document.documentElement.dataset.theme = localStorage.getItem('hub.theme.active') || stored.theme || 'aoc';
            document.documentElement.dataset.mode = localStorage.getItem('hub.theme.mode') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (_) {
            document.documentElement.dataset.theme = 'aoc';
            document.documentElement.dataset.mode = 'dark';
        }
        </script>
        <!-- monaco is loaded through its amd loader; editor.main sets up MonacoEnvironment itself, wrapping each worker in a blob so the cross-origin cdn works -->
        <script>
        window.MONACO_CDN = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.57.0/min';
        </script>
        <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.57.0/min/vs/loader.js"
            integrity="sha384-jwxunh5pHKFzi60XobDcwOM7qnk4lSGpdBU/hNn9pUGp+ZUpaHJqadNLRF2k+jPu" crossorigin="anonymous"></script>
        <script>
        require.config({ paths: { vs: window.MONACO_CDN + '/vs' } });
        </script>
    </head>

    <body>
        <div id="snowflakes"></div>
        <header id="topbar"></header>
        <main id="dashboard" class="view hidden"></main>
        <main id="workspace" class="view hidden"></main>
        <script type="module" src="/dist/main.js"></script>
    </body>
</html>
